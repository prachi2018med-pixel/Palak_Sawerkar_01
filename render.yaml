services:
  - type: web
    name: cybertrace-backend
    env: python
    buildCommand: "pip install -r requirements.txt && python scripts/seed_database.py"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: CORS_ORIGINS
        value: "*"

  - type: web
    name: cybertrace-frontend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "streamlit run frontend/app.py --server.port $PORT --server.address 0.0.0.0"
    envVars:
      - key: BACKEND_URL
        value: "https://cybertrace-backend.onrender.com"
